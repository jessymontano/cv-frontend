<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Jessica Montaño</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/colors.css" />
    <script
      src="https://kit.fontawesome.com/fff3927b37.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!--HEADER: encabezado de la pagina-->
    <header class="text-center justify-content-center p-2 mb-4 shadow-sm">
      <img
        src="https://file.garden/aI-dN-hcsj3aoMCa/frontend/cv/carita.png"
        alt="cabeza de skin de minecraft"
        width="100"
      />
      <h1>JESSICA MONTAÑO</h1>
      <p>Ingeniera en Sistemas de Información</p>
      <!--NAV: barra de navegacion -->

      <nav
        class="bg-body-tertiary navbar navbar-expand-lg justify-content-center"
      >
        <ul class="nav nav-pills justify-space-between">
          <li class="nav-item">
            <a href="./index.html" class="nav-link mx-2">Inicio</a>
          </li>
          <li class="nav-item">
            <a href="./proyectos.html" class="nav-link mx-2">Proyectos</a>
          </li>
          <li class="nav-item">
            <a
              href="./contacto.html"
              class="nav-link active mx-2"
              aria-current="page"
              >Contacto</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <section id="contacto" class="my-5" aria-labelledby="contacto-titulo">
      <div class="container">
        <h2 id="contacto-titulo" class="text-center mb-4">
          <i class="fa-solid fa-message"></i>Contacto
        </h2>

        <form class="row g-3" aria-label="Formulario de contacto">
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              aria-required="true"
              aria-describedby="nombre-help"
            />
            <div id="nombre-help" class="form-text">
              Ingresa tu nombre completo
            </div>
          </div>

          <div class="col-md-6">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              aria-required="true"
              aria-describedby="correo-help"
            />
            <div id="correo-help" class="form-text">
              Tu correo no será compartido
            </div>
          </div>

          <div class="col-12">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea
              class="form-control"
              id="mensaje"
              rows="4"
              aria-required="true"
              aria-describedby="mensaje-help"
            ></textarea>
            <div id="mensaje-help" class="form-text">
              Describe el motivo de tu contacto
            </div>
          </div>

          <div class="col-12">
            <button
              type="submit"
              class="btn btn-primary"
              aria-label="Enviar formulario de contacto"
            >
              Enviar mensaje
            </button>
          </div>
        </form>
      </div>
    </section>
    <!--FOOTER-->
    <footer
      class="bg-body-tertiary text-center text-lg-start shadow-top mt-auto text-center"
    >
      <div class="text-center">
        <a href="#"><i class="fa fa-github" aria-hidden="true"></i></a
        ><a href="#"><i class="fa fa-linkedin" aria-hidden="true"></i></a>
        <a href="tel:+526621785679" class="btn-footer">
          <i class="fa-solid fa-phone"></i>
        </a>
        <a href="mailto:cafecontacto@gmail.com">
          <i class="fa-solid fa-envelope"></i
        ></a>

        <button class="mt-2">Descargar CV</button>
      </div>
      <p class="text-center p-3">
        &copy; 2025 Jessica Montaño. Todos los derechos reservados.
      </p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
